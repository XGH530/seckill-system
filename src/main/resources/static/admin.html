<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理控制台 · 分布式高并发秒杀系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8382f'/%3E%3Cpath d='M18 5 8 18h6l-2 9 10-13h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin">

<!-- ==================== 管理员登录 ==================== -->
<div class="login-layer" id="loginLayer">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 32 32" fill="none"><path d="M18 5 8 18h6l-2 9 10-13h-6z" fill="#fff"/></svg></div>
    <h1>秒杀管理控制台</h1>
    <div class="sub">分布式高并发秒杀系统 · 管理员登录</div>

    <div style="margin-bottom:14px">
      <label>管理员账号</label>
      <input class="inp" style="width:100%" id="loginUser" value="admin" autocomplete="username">
    </div>
    <div style="margin-bottom:20px">
      <label>密码</label>
      <input class="inp" style="width:100%" id="loginPwd" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-red" style="width:100%;justify-content:center" id="loginBtn" onclick="Admin.login()">
      <i class="bi bi-box-arrow-in-right"></i> 登 录
    </button>
    <div class="hint" id="loginHint">
      演示管理员：<b>admin / 123456</b><br>
      管理接口做了角色校验：普通用户登录会提示「不是管理员」
    </div>
  </div>
</div>

<div class="layout" id="appLayer" style="display:none">
  <!-- ==================== 侧边栏 ==================== -->
  <aside class="admin-side">
    <div class="admin-brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none"><path d="M18 5 8 18h6l-2 9 10-13h-6z" fill="#fff"/></svg>
      </div>
      <div>
        <b>秒杀管理台</b>
        <span>SECKILL ADMIN</span>
      </div>
    </div>

    <nav class="admin-nav" id="nav">
      <div class="group">数据总览</div>
      <a class="on" data-tab="dashboard"><i class="bi bi-speedometer2"></i> 运营概览</a>
      <div class="group">活动与商品</div>
      <a data-tab="activities"><i class="bi bi-lightning-charge"></i> 秒杀活动</a>
      <a data-tab="goods"><i class="bi bi-box-seam"></i> 商品管理</a>
      <div class="group">交易数据</div>
      <a data-tab="orders"><i class="bi bi-receipt"></i> 订单管理</a>
      <a data-tab="users"><i class="bi bi-people"></i> 用户管理</a>
      <div class="group">系统</div>
      <a data-tab="ops"><i class="bi bi-activity"></i> 运维监控</a>
    </nav>

    <div class="foot">
      演示环境 · 单机部署<br>
      <a href="/" style="color:#c3c8d0">← 返回秒杀演示页</a>
    </div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <main class="admin-main">
    <header class="admin-top">
      <h1 id="pageTitle">运营概览</h1>
      <span class="chip info" id="chipProfile">demo · H2 内存库</span>
      <span class="chip" id="chipOrder">订单 --</span>
      <span class="chip" id="chipStock">库存 --</span>
      <div class="right">
        <span class="muted" style="font-size:12.5px" id="clock"></span>
        <a class="btn btn-gray btn-xs" href="/doc.html" target="_blank"><i class="bi bi-file-earmark-code"></i> 接口文档</a>
        <button class="btn btn-gray btn-xs" onclick="Admin.reload()"><i class="bi bi-arrow-clockwise"></i> 刷新</button>
        <button class="btn btn-gray btn-xs" onclick="Admin.logout()"><i class="bi bi-box-arrow-right"></i> 退出</button>
      </div>
    </header>

    <section class="content" id="content"></section>
  </main>
</div>

<div class="toast-box" id="toastBox"></div>

<!-- 商品编辑弹窗 -->
<div id="goodsModal" style="display:none;position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:2500;
     align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;width:100%;max-width:520px;padding:24px 26px;box-shadow:0 30px 70px rgba(0,0,0,.3)">
    <h3 style="margin:0 0 18px;font-size:16px;font-weight:600" id="goodsModalTitle">新增商品</h3>
    <div id="goodsForm"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
      <button class="btn btn-gray" onclick="Admin.closeGoodsModal()">取消</button>
      <button class="btn btn-red" onclick="Admin.saveGoods()"><i class="bi bi-check2"></i> 保存</button>
    </div>
  </div>
</div>

<script src="/assets/js/admin.js"></script>
<script>Admin.init();</script>
</body>
</html>
